<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무비 티어 · 내 영화 티어리스트</title>
<style>
:root{
  --bg:#09090d;--panel:#14141c;--panel2:#1c1c27;--line:#2b2b3a;--text:#ece8e1;--mute:#9b98a8;
  --red:#d7263d;--gold:#e8b64c;
  --S:#ff5f5f;--A:#ff9a52;--B:#ffd048;--C:#b6e45a;--D:#4fd6a0;--F:#8f8fd6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--text);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  background:radial-gradient(1100px 480px at 50% -220px,#3d0e18 0,transparent 70%),var(--bg);background-attachment:fixed}
button,input{font:inherit;color:inherit}
a{color:var(--gold)}
h2,h3{margin:0}
.hidden,[hidden]{display:none!important}

/* 상단 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 18px;background:rgba(9,9,13,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-size:1.05rem;letter-spacing:.06em;color:var(--gold)}
.logo b{font-weight:900}
.top nav{display:flex;gap:6px;flex:1}
.tab{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--mute);cursor:pointer}
.tab.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem}
.who>span{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold)}
.ico{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.ico:hover{border-color:var(--gold)}

main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h2{font-size:1.5rem}
.sub{margin:4px 0 0;color:var(--mute);font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn.wide{width:100%;margin-top:14px}
.btn:disabled{opacity:.5;cursor:default}
.savebar{font-size:.8rem;margin:0 0 14px;color:var(--mute)}
.savebar.ok{color:#6fdca0}.savebar.bad{color:#ff8b8b}

/* 티어 */
.tier{display:flex;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tl{flex:0 0 64px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:#15151a;background:var(--c)}
.t-S{--c:var(--S)}.t-A{--c:var(--A)}.t-B{--c:var(--B)}.t-C{--c:var(--C)}.t-D{--c:var(--D)}.t-F{--c:var(--F)}
.zone{flex:1;display:flex;flex-wrap:wrap;gap:8px;padding:8px;min-height:148px;align-content:flex-start;transition:background .15s}
.zone:empty::after{content:attr(data-empty);color:#5d5b6b;font-size:.85rem;align-self:center;margin:auto}
.zone.over{outline:2px dashed var(--gold);outline-offset:-3px;background:rgba(232,182,76,.08)}
.pool{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pool h3{padding:12px 14px 0;font-size:1rem}
.pool h3 span{color:var(--gold);margin-left:6px}
.pool .zone{min-height:120px}

.card{width:92px;cursor:grab;user-select:none;-webkit-user-select:none}
.card.dragging{opacity:.35}
.poster{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;
  background:linear-gradient(160deg,hsl(var(--h) 45% 28%),hsl(var(--h) 50% 13%));box-shadow:0 2px 8px rgba(0,0,0,.5)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;font-size:.7rem;line-height:1.2;color:#ddd}
.ph b{font-weight:600;word-break:keep-all}
.ct{margin-top:4px;font-size:.72rem;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.card:hover .poster{box-shadow:0 0 0 2px var(--gold)}
.mini{width:68px;cursor:default}
.mini .ct{font-size:.65rem}
.mini.solo .poster{outline:2px dashed #e8b64c99;outline-offset:1px}
.mini:hover .poster{box-shadow:0 2px 8px rgba(0,0,0,.5)}

/* 모달 */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px}
.box h3{font-size:1.15rem;margin-bottom:12px}
.box .x{float:right;background:none;border:0;color:var(--mute);font-size:1.3rem;cursor:pointer;margin:-6px -6px 0 0}
.sheet{display:flex;gap:14px;align-items:flex-start}
.sheet .poster{width:96px;flex:none}
.sheet h3{margin-bottom:2px}
.tierbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:14px 0 10px}
.tb{border:0;border-radius:8px;padding:12px 0;font-weight:900;font-size:1.2rem;color:#15151a;background:var(--c);cursor:pointer;opacity:.85}
.tb:hover,.tb.cur{opacity:1;box-shadow:0 0 0 2px #fff}
.row2{display:flex;gap:8px;flex-wrap:wrap}

/* 폼 */
.auth{max-width:420px;margin:7vh auto 0;padding:0 16px}
.auth .logo{text-align:center;font-size:1.6rem;margin-bottom:4px}
.auth .tag{text-align:center;color:var(--mute);margin:0 0 20px;font-size:.92rem}
.auth form,.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 5px}
label:first-child{margin-top:0}
input[type=text],input[type=password],input[type=search],input:not([type]){width:100%;background:#0d0d13;border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none}
input:focus{border-color:var(--gold)}
.hint{color:var(--mute);font-size:.8rem;line-height:1.5;margin:12px 0 0}
.err{color:#ff8b8b;font-size:.85rem;min-height:1.2em;margin-top:10px}
.warn,.note{background:#2a2110;border:1px solid #5c4a1c;color:#f1d58b;border-radius:10px;padding:10px 12px;font-size:.82rem;line-height:1.5;margin:0 0 12px}
.codebox{font:800 1.6rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-align:center;background:#0d0d13;border:1px dashed var(--gold);border-radius:10px;padding:16px;margin:14px 0;color:var(--gold);user-select:all}
.linkbtn{background:none;border:0;color:var(--gold);cursor:pointer;padding:0;text-decoration:underline;font-size:.85rem}

/* 검색 · 결과 */
.search{margin:0 0 12px}
.res{display:flex;flex-direction:column;gap:6px}
.rrow{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px}
.thumb{width:40px;flex:none}
.thumb .poster{border-radius:4px}.thumb .ph{display:none}
.rinfo{flex:1;min-width:0}
.rinfo b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rinfo small{color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:26px 8px;font-size:.92rem}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;margin:14px 0;flex-wrap:wrap}
.seg button{background:none;border:0;padding:7px 14px;border-radius:999px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--red);color:#fff;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.fchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.82rem;cursor:pointer;color:var(--mute)}
.fchip.on{border-color:var(--gold);color:var(--gold)}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:.92rem;line-height:1.6}
.summary b{color:var(--gold)}

/* 나란히 */
.side .sr,.side .sh{display:grid;grid-template-columns:64px 1fr 1fr;gap:0}
.side .sh{margin-bottom:6px;text-align:center;font-weight:700;font-size:.92rem}
.side .sh div{padding:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .sr{margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.side .sc{display:flex;flex-wrap:wrap;gap:6px;padding:8px;min-height:104px;align-content:flex-start;border-left:1px solid var(--line)}
.legend{font-size:.78rem;color:var(--mute);margin:0 0 10px}

/* 영화별 */
.mrow{display:grid;grid-template-columns:44px 1fr 64px 64px;gap:10px;align-items:center;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:5px}
.mrow.mh{background:none;border:0;color:var(--mute);font-size:.8rem;padding:0 10px;text-align:center}
.mrow .tt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .tt small{color:var(--mute);font-size:.76rem}
.mrow .tt small.same{color:#6fdca0}.mrow .tt small.solo{color:var(--gold)}
.chip{display:inline-block;min-width:44px;text-align:center;padding:4px 8px;border-radius:8px;font-weight:900;color:#15151a;background:var(--c)}
.chip.none{background:#262633;color:var(--mute);font-weight:500;font-size:.74rem;padding:5px 4px}
.cellc{text-align:center}
.foot{text-align:center;color:#5d5b6b;font-size:.75rem;padding:0 16px 30px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f2eee6;color:#111;padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:80;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

@media(max-width:640px){
  .top{padding:8px 10px;gap:8px}
  .top nav{order:3;flex:1 0 100%}
  .tab{flex:1;padding:8px 6px;font-size:.9rem}
  .who{margin-left:auto}
  main{padding:14px 10px 50px}
  .head h2{font-size:1.25rem}
  .tl{flex-basis:42px;font-size:1.4rem}
  .card{width:68px}
  .zone{gap:6px;padding:6px;min-height:122px}
  .mini{width:54px}
  .side .sr,.side .sh{grid-template-columns:40px 1fr 1fr}
  .side .sc{gap:4px;padding:5px}
  .mrow{grid-template-columns:36px 1fr 52px 52px;gap:6px}
  .tierbtns{gap:4px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ 기본 데이터 ============ */
const TIERS=['S','A','B','C','D','F'];
// [한국어 제목, 개봉연도, TMDB 검색용 원제]
const SEED_RAW=[
['기생충',2019,'Parasite'],['인터스텔라',2014,'Interstellar'],['라라랜드',2016,'La La Land'],
['센과 치히로의 행방불명',2001,'Spirited Away'],['어벤져스: 엔드게임',2019,'Avengers: Endgame'],
['범죄도시',2017,'The Outlaws'],['타이타닉',1997,'Titanic'],['토이 스토리',1995,'Toy Story'],
['인셉션',2010,'Inception'],['다크 나이트',2008,'The Dark Knight'],['올드보이',2003,'Oldboy'],
['부산행',2016,'Train to Busan'],['살인의 추억',2003,'Memories of Murder'],['아가씨',2016,'The Handmaiden'],
['극한직업',2019,'Extreme Job'],['명량',2014,'The Admiral: Roaring Currents'],['택시운전사',2017,'A Taxi Driver'],
['베테랑',2015,'Veteran'],['암살',2015,'Assassination'],['신과함께-죄와 벌',2017,'Along with the Gods: The Two Worlds'],
['도둑들',2012,'The Thieves'],['괴물',2006,'The Host'],['범죄도시2',2022,'The Roundup'],
['헤어질 결심',2022,'Decision to Leave'],['쇼생크 탈출',1994,'The Shawshank Redemption'],
['포레스트 검프',1994,'Forrest Gump'],['대부',1972,'The Godfather'],['펄프 픽션',1994,'Pulp Fiction'],
['파이트 클럽',1999,'Fight Club'],['매트릭스',1999,'The Matrix'],['글래디에이터',2000,'Gladiator'],
['아바타',2009,'Avatar'],['쥬라기 공원',1993,'Jurassic Park'],['라이온 킹',1994,'The Lion King'],
['겨울왕국',2013,'Frozen'],['해리 포터와 마법사의 돌',2001,"Harry Potter and the Philosopher's Stone"],
['반지의 제왕: 반지 원정대',2001,'The Lord of the Rings: The Fellowship of the Ring'],['조커',2019,'Joker'],
['어벤져스: 인피니티 워',2018,'Avengers: Infinity War'],['아이언맨',2008,'Iron Man'],['블랙 팬서',2018,'Black Panther'],
['듄',2021,'Dune'],['오펜하이머',2023,'Oppenheimer'],['탑건: 매버릭',2022,'Top Gun: Maverick'],
['스파이더맨: 노 웨이 홈',2021,'Spider-Man: No Way Home'],['매드맥스: 분노의 도로',2015,'Mad Max: Fury Road'],
['위플래쉬',2014,'Whiplash'],['코코',2017,'Coco'],['너의 이름은.',2016,'Your Name.'],['업',2009,'Up']
];
const SEED=SEED_RAW.map((r,i)=>({id:'s'+(i+1),title:r[0],year:r[1],q:r[2]}));
const SEEDMAP={};SEED.forEach(s=>SEEDMAP[s.id]=s);

/* ============ 저장소 ============ */
const DBK='mt_db_v1',CFGK='mt_cfg_v1',PCK='mt_poster_v1',SESK='mt_session';
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?v:d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
let storageOk=(()=>{try{localStorage.setItem('mt_t','1');localStorage.removeItem('mt_t');return true}catch(e){return false}})();
let db=load(DBK,{users:{}});if(!db.users)db.users={};
let cfg=load(CFGK,{key:''});if(typeof cfg.key!=='string')cfg.key='';
let pc=load(PCK,{});            // 포스터 캐시 {시드id:{p:포스터경로,t:TMDB id}}
let me=null;
try{const sk=localStorage.getItem(SESK);if(sk&&db.users[sk])me=sk}catch(e){}
const S={view:'mine'};
const F={q:'',target:null,mode:'view',filter:'all'};
let A={step:'nick',nick:'',code:'',pending:null};

/* ============ 유틸 ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[\s\-:.,!?'"·]/g,'');
const mine=()=>db.users[me];
const nkey=n=>n.toLowerCase();
const normNick=s=>String(s||'').normalize('NFC').trim().replace(/\s+/g,' ');
const normCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    return 'f'+(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')}
}
function rnd(n){const a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<n;i++)a[i]=Math.random()*256;return a}
const randHex=n=>[...rnd(n)].map(x=>x.toString(16).padStart(2,'0')).join('');
function genCode(){const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const a=rnd(12);let s='';a.forEach((x,i)=>{s+=al[x%al.length];if(i%4===3&&i<11)s+='-'});return s}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function persist(){const ok=save(DBK,db);setSave(ok);return ok}
function setSave(ok){const el=$('#savebar');if(!el)return;el.className='savebar '+(ok?'ok':'bad');
  el.textContent=ok?'● 자동 저장됨 · '+new Date().toLocaleTimeString('ko-KR'):'⚠ 저장에 실패했어요. 브라우저의 저장 공간·개인정보 설정을 확인해 주세요.'}

/* ============ 영화 / 포스터 ============ */
function posterUrl(m,size){const p=m.poster||(pc[m.id]&&pc[m.id].p);return p&&p[0]==='/'?'https://image.tmdb.org/t/p/'+(size||'w342')+p:''}
function tmdbIdOf(m){return typeof m.id==='number'?m.id:(pc[m.id]&&pc[m.id].t)||0}
function ck(m){const t=tmdbIdOf(m);if(t)return 't'+t;if(SEEDMAP[m.id])return m.id;return 'n:'+norm(m.title)+'|'+(m.year||'')}
function posterHtml(m){const u=posterUrl(m);
  return `<div class="poster" style="--h:${hue(m.title)}"><span class="ph">🎬<b>${esc(m.title)}</b></span>${u?`<img src="${esc(u)}" alt="" loading="lazy" draggable="false" onerror="this.remove()">`:''}</div>`}
function card(m,editable){return `<div class="card" ${editable?'draggable="true"':''} data-id="${esc(m.id)}" title="${esc(m.title)}">${posterHtml(m)}<div class="ct">${esc(m.title)}</div></div>`}
function miniCard(m,solo){return `<div class="card mini ${solo?'solo':''}" title="${esc(m.title)}${solo?' (상대 미평가)':''}">${posterHtml(m)}<div class="ct">${esc(m.title)}</div></div>`}
function newUserList(){return SEED.map(s=>({id:s.id,title:s.title,year:s.year,poster:'',tier:null}))}
const findMovie=(u,id)=>u.list.find(m=>String(m.id)===String(id));

function tmdb(path,params){
  const u=new URL('https://api.themoviedb.org/3'+path);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const opt={};if(cfg.key.startsWith('eyJ'))opt.headers={Authorization:'Bearer '+cfg.key};else u.searchParams.set('api_key',cfg.key);
  return fetch(u.toString(),opt).then(r=>{if(r.status===401)throw new Error('auth');if(!r.ok)throw new Error('http');return r.json()})
}
let resolving=false,refreshT=0;
function scheduleRefresh(){clearTimeout(refreshT);refreshT=setTimeout(()=>{if(!me)return;if(S.view==='mine')renderMineBody();else renderDetail()},250)}
async function resolvePosters(movies){
  if(!cfg.key||resolving)return;
  const todo=movies.filter(m=>SEEDMAP[m.id]&&!pc[m.id]);
  if(!todo.length)return;
  resolving=true;
  try{
    for(let i=0;i<todo.length;i+=5){
      await Promise.all(todo.slice(i,i+5).map(async m=>{
        const s=SEEDMAP[m.id];
        try{const d=await tmdb('/search/movie',{query:s.q,year:s.year,language:'ko-KR',include_adult:'false'});
          const r=d.results&&d.results[0];pc[m.id]={p:(r&&r.poster_path)||'',t:(r&&r.id)||0}}
        catch(e){if(e.message==='auth')throw e}
      }));
      save(PCK,pc);scheduleRefresh();
    }
  }catch(e){if(e.message==='auth')toast('TMDB API 키가 올바르지 않아요. 설정에서 확인해 주세요.')}
  finally{resolving=false}
}

    <div class="err" id="aerr"></div><button class="btn primary wide">로그인</button>
    <p class="hint"><button type="button" class="linkbtn" onclick="authGo('reset')">비밀번호를 잊으셨나요?</button> · <button type="button" class="linkbtn" onclick="authGo('nick')">다른 닉네임</button></p></form>`;
  else if(A.step==='signup')b=`<form onsubmit="authSignup(event);return false"><label>새 닉네임</label><input value="${esc(A.nick)}" disabled>
    <label for="f2">비밀번호 (4자 이상)</label><input id="f2" type="password" autocomplete="new-password">
    <label for="f3">비밀번호 확인</label><input id="f3" type="password" autocomplete="new-password">
    <div class="err" id="aerr"></div><button class="btn primary wide">계정 만들기</button>
    <p class="hint">가입 후 비밀번호 복구에 쓰는 <b>복구 코드</b>를 한 번 보여드려요.</p>
    <p class="hint"><button type="button" class="linkbtn" onclick="authGo('nick')">← 닉네임 다시 입력</button></p></form>`;
  else if(A.step==='reset')b=`<form onsubmit="authReset(event);return false"><label for="f1">닉네임</label><input id="f1" maxlength="20" value="${esc(A.nick)}">
    <label for="f2">복구 코드</label><input id="f2" placeholder="XXXX-XXXX-XXXX" autocomplete="off">
    <label for="f3">새 비밀번호 (4자 이상)</label><input id="f3" type="password" autocomplete="new-password">

    <p class="hint"><button type="button" class="linkbtn" onclick="authGo('nick')">← 돌아가기</button></p></form>`;
  else if(A.step==='code')b=`<div class="panelbox"><h3>🔑 복구 코드를 저장해 주세요</h3>
    <p class="hint" style="margin-top:8px">비밀번호를 잊어버렸을 때 이 코드로만 재설정할 수 있어요. <b>지금 한 번만</b> 보여드리니 메모하거나 복사해 두세요.</p>
    <div class="codebox">${esc(A.code)}</div>

  return `<div class="auth"><div class="logo">🎬 <b>MOVIE TIER</b></div><p class="tag">내가 본 영화를 S부터 F까지, 친구와 비교해 보세요</p>${warn}${b}
  <div class="panelbox" style="margin-top:12px"><button class="linkbtn" onclick="toggleTransferImport()">다른 기기에서 계정 가져오기</button><div id="transferImport" hidden style="margin-top:10px"><p class="hint">기존 기기에서 복사한 계정 이동 코드를 붙여넣으세요. 계정과 영화 등급이 이 브라우저로 복사됩니다.</p><textarea id="transferText" rows="3" style="width:100%;margin-top:8px;background:#0d0d13;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px" placeholder="MT1:로 시작하는 이동 코드"></textarea><button class="btn sm" style="margin-top:8px" onclick="importTransferCode()">계정 가져오기</button></div></div></div>`;

function authGo(step){A.step=step;if(step==='nick')A.nick='';render()}
function aerr(m){const e=$('#aerr');if(e)e.textContent=m}
function checkNick(n){if(n.length<2||n.length>20)return '닉네임은 2~20자로 입력해 주세요.';if(/[\u0000-\u001f<>]/.test(n))return '닉네임에 사용할 수 없는 문자가 있어요.';return ''}
function authNick(e){e.preventDefault();const n=normNick($('#f1').value);const er=checkNick(n);if(er)return aerr(er);
  A.nick=n;A.step=db.users[nkey(n)]?'login':'signup';render()}
async function authLogin(e){e.preventDefault();const u=db.users[nkey(A.nick)];if(!u)return authGo('nick');
  const h=await sha(u.salt+':'+$('#f2').value);if(h!==u.ph)return aerr('비밀번호가 맞지 않아요.');
  me=nkey(A.nick);try{localStorage.setItem(SESK,me)}catch(x){}S.view='mine';render()}
async function authSignup(e){e.preventDefault();const pw=$('#f2').value,pw2=$('#f3').value;
  if(pw.length<4)return aerr('비밀번호는 4자 이상이어야 해요.');if(pw!==pw2)return aerr('비밀번호 확인이 일치하지 않아요.');
  const key=nkey(A.nick);if(db.users[key]){A.step='login';return render()}
  const salt=randHex(16),code=genCode();
  db.users[key]={nick:A.nick,salt,ph:await sha(salt+':'+pw),rh:await sha(salt+':rc:'+normCode(code)),created:Date.now(),list:newUserList()};
  if(!save(DBK,db)){delete db.users[key];return aerr('저장에 실패해서 계정을 만들 수 없어요. 브라우저 저장 설정을 확인해 주세요.')}
  A.pending=key;A.code=code;A.step='code';render()}
async function authReset(e){e.preventDefault();const n=normNick($('#f1').value),key=nkey(n),u=db.users[key];
  const code=$('#f2').value,pw=$('#f3').value;
  if(!u)return aerr('해당 닉네임의 계정을 찾을 수 없어요.');
  if(pw.length<4)return aerr('새 비밀번호는 4자 이상이어야 해요.');
  if(await sha(u.salt+':rc:'+normCode(code))!==u.rh)return aerr('복구 코드가 맞지 않아요.');
  const nc=genCode();u.ph=await sha(u.salt+':'+pw);u.rh=await sha(u.salt+':rc:'+normCode(nc));
  if(!save(DBK,db))return aerr('저장에 실패했어요.');
  A.nick=u.nick;A.pending=key;A.code=nc;A.step='code';render();toast('비밀번호를 재설정했어요. 새 복구 코드를 저장해 주세요.')}
function authEnter(){me=A.pending;try{localStorage.setItem(SESK,me)}catch(x){}A.step='nick';S.view='mine';render()}
function copyCode(){const c=A.code;(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('복사했어요.'),()=>{const r=document.createRange();r.selectNodeContents($('.codebox'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('코드를 선택했어요. 직접 복사해 주세요.')})}

/* ============ 영화 추가 ============ */
let addRes=[],addTimer=0;
function openAdd(){
  openModal(`<button class="x" data-act="close" aria-label="닫기">✕</button><h3>영화 추가</h3>
  ${cfg.key?'':'<div class="note">TMDB API 키가 없어서 기본 인기 영화 안에서만 검색해요. <a href="#" data-act="settings">설정에서 키를 입력</a>하면 한국·해외 영화를 모두 검색하고 포스터도 볼 수 있어요.</div>'}
  <div class="search"><input id="aq" type="search" placeholder="영화 제목 검색" autocomplete="off"></div><div id="ares" class="res"></div>`);
  const i=$('#aq');i.focus();i.oninput=()=>{clearTimeout(addTimer);addTimer=setTimeout(doAddSearch,cfg.key?350:80)};doAddSearch();
}
function isDup(r){const u=mine();return u.list.some(m=>m.id===r.id||ck(m)===ck(r))}
function localSearch(q){const nq=norm(q);return SEED.filter(s=>!nq||norm(s.title).includes(nq)||norm(s.q).includes(nq)).map(s=>({id:s.id,title:s.title,orig:s.q,year:s.year,poster:(pc[s.id]&&pc[s.id].p)||''}))}
async function doAddSearch(){
  const inp=$('#aq');if(!inp)return;const q=inp.value.trim();const box=$('#ares');
  if(cfg.key&&q){
    box.innerHTML='<div class="empty">검색 중…</div>';
    try{const d=await tmdb('/search/movie',{query:q,language:'ko-KR',include_adult:'false'});
      if($('#aq')&&$('#aq').value.trim()!==q)return;
      addRes=(d.results||[]).slice(0,20).map(r=>({id:r.id,title:r.title||r.original_title,orig:r.original_title,year:(r.release_date||'').slice(0,4),poster:r.poster_path||''}))}
    catch(e){addRes=localSearch(q);box.dataset.err=e.message==='auth'?'API 키가 올바르지 않아요. 설정에서 확인해 주세요.':'검색 중 문제가 생겨 기본 목록에서 찾았어요. 네트워크를 확인해 주세요.'}
  }else if(cfg.key&&!q){addRes=[]}
  else addRes=localSearch(q);
  renderAddRes(q);
}
function renderAddRes(q){
  const box=$('#ares');if(!box)return;let h='';
  if(box.dataset.err){h+=`<div class="note">${esc(box.dataset.err)}</div>`;box.dataset.err=''}
  if(!addRes.length)h+=`<div class="empty">${q?'검색 결과가 없어요.':'영화 제목을 입력해 보세요.'}</div>`;
  h+=addRes.map((r,i)=>{const d=isDup(r);return `<div class="rrow"><div class="thumb">${posterHtml({id:r.id,title:r.title,poster:r.poster})}</div>
   <div class="rinfo"><b>${esc(r.title)}</b><small>${esc([r.orig&&r.orig!==r.title?r.orig:'',r.year].filter(Boolean).join(' · '))}</small></div>
   <button class="btn sm" data-act="add" data-i="${i}" ${d?'disabled':''}>${d?'추가됨':'추가'}</button></div>`}).join('');
  if(q)h+=`<div class="rrow"><div class="rinfo"><b>“${esc(q)}” 직접 추가</b><small>목록에 없으면 제목만으로 추가할 수 있어요</small></div><button class="btn sm" data-act="manual">추가</button></div>`;
  box.innerHTML=h;
}
function addFromRes(i,btn){const r=addRes[i];if(!r||isDup(r))return;
  mine().list.push({id:r.id,title:r.title,year:r.year,poster:r.poster||'',tier:null});
  persist();renderMineBody();btn.disabled=true;btn.textContent='추가됨';toast('‘'+r.title+'’을(를) 미분류에 추가했어요.');
  if(SEEDMAP[r.id])resolvePosters([r])}
function addManual(){const t=$('#aq').value.trim();if(!t)return;
  mine().list.push({id:'c'+Date.now().toString(36)+randHex(2),title:t,year:'',poster:'',tier:null});
  persist();renderMineBody();renderAddRes(t);toast('‘'+t+'’을(를) 추가했어요.')}

function renderDetail(){
  const el=$('#fdet');if(!el)return;

  let h=`<h3 style="margin-top:20px">${esc(o.nick)}</h3><div class="seg">
   <button class="${F.mode==='view'?'on':''}" onclick="setMode('view')">상대 티어리스트</button>
   <button class="${F.mode==='side'?'on':''}" onclick="setMode('side')">나란히 비교</button>
   <button class="${F.mode==='by'?'on':''}" onclick="setMode('by')">영화별 비교</button></div>`;
  if(F.mode==='view'){
    const{by,pool}=groupList(o.list);const n=ratedCount(o);
    h+=n?`<p class="legend">등급을 매긴 영화 ${n}편 · 미분류 ${pool.length}편</p>`+TIERS.map(t=>`<div class="tier"><div class="tl t-${t}">${t}</div><div class="zone" data-empty="이 등급의 영화가 없어요">${by[t].map(m=>miniCard(m,false)).join('')}</div></div>`).join('')
      :'<div class="empty">이 사용자는 아직 등급을 매긴 영화가 없어요.</div>';
  }else{
    const rows=buildCompare(u,o);
    if(!rows.length)h+='<div class="empty">비교할 영화가 없어요. 두 사람 중 누구도 아직 등급을 매기지 않았어요.</div>';
    else h+=F.mode==='side'?sideView(u,o):byView(rows);
  }
  el.innerHTML=h;
}
function buildCompare(a,b){
  const mp=new Map();
  const add=(u,side)=>u.list.forEach(m=>{if(!TIERS.includes(m.tier))return;const k=ck(m);const r=mp.get(k)||{m,a:null,b:null};r[side]=m.tier;if(!posterUrl(r.m)&&posterUrl(m))r.m=m;mp.set(k,r)});
  add(a,'a');add(b,'b');return[...mp.values()];
}
function sideView(a,o){
  const rated=u=>{const s=new Set();u.list.forEach(m=>{if(TIERS.includes(m.tier))s.add(ck(m))});return s};
  const sa=rated(a),sb=rated(o),ga=groupList(a.list).by,gb=groupList(o.list).by;
  return `<p class="legend">점선 테두리 = 상대방이 아직 평가하지 않은 영화</p><div class="side"><div class="sh"><div></div><div>나 (${esc(a.nick)})</div><div>${esc(o.nick)}</div></div>`+
   TIERS.map(t=>`<div class="sr"><div class="tl t-${t}">${t}</div><div class="sc">${ga[t].map(m=>miniCard(m,!sb.has(ck(m)))).join('')}</div><div class="sc">${gb[t].map(m=>miniCard(m,!sa.has(ck(m)))).join('')}</div></div>`).join('')+'</div>';
}
function byView(rows){
  const idx=t=>t?TIERS.indexOf(t):-1;
  const both=rows.filter(r=>r.a&&r.b),same=both.filter(r=>r.a===r.b).length,solo=rows.length-both.length;
  const pred={all:()=>true,same:r=>r.a&&r.b&&r.a===r.b,diff:r=>r.a&&r.b&&r.a!==r.b,solo:r=>!(r.a&&r.b)}[F.filter];
  rows=rows.filter(pred).sort((x,y)=>{const sx=x.a&&x.b,sy=y.a&&y.b;if(sx!==sy)return sx?-1:1;
    const ax=(idx(x.a)+idx(x.b)+(sx?0:1))/(sx?2:1),ay=(idx(y.a)+idx(y.b)+(sy?0:1))/(sy?2:1);return ax-ay||x.m.title.localeCompare(y.m.title,'ko')});
  const chip=t=>t?`<span class="chip t-${t}">${t}</span>`:'<span class="chip none">미평가</span>';
  const fl=[['all','전체'],['same','같은 등급'],['diff','다른 등급'],['solo','한쪽만 평가']];
  return `<div class="summary">함께 평가한 영화 <b>${both.length}편</b> 중 같은 등급 <b>${same}편</b>${both.length?` (일치율 <b>${Math.round(same/both.length*100)}%</b>)`:''} · 한쪽만 평가 <b>${solo}편</b></div>
  <div class="chips">${fl.map(([k,l])=>`<button class="fchip ${F.filter===k?'on':''}" onclick="setFilter('${k}')">${l}</button>`).join('')}</div>
  <div class="mrow mh"><div></div><div style="text-align:left">영화</div><div>내 등급</div><div>상대 등급</div></div>`+
  (rows.length?rows.map(r=>{let st='';
    if(r.a&&r.b)st=r.a===r.b?'<small class="same">같은 등급</small>':`<small>${Math.abs(idx(r.a)-idx(r.b))}단계 차이</small>`;
    else st='<small class="solo">한쪽만 평가</small>';
    return `<div class="mrow"><div class="thumb">${posterHtml(r.m)}</div><div class="tt"><b title="${esc(r.m.title)}">${esc(r.m.title)}</b>${st}</div><div class="cellc">${chip(r.a)}</div><div class="cellc">${chip(r.b)}</div></div>`}).join(''):'<div class="empty">조건에 맞는 영화가 없어요.</div>');
}

/* ============ PNG 저장 ============ */
function loadImg(url){return new Promise(res=>{if(!url)return res(null);const i=new Image();i.crossOrigin='anonymous';const t=setTimeout(()=>res(null),10000);
  i.onload=()=>{clearTimeout(t);res(i)};i.onerror=()=>{clearTimeout(t);res(null)};i.src=url})}
function fitText(ctx,s,w){if(ctx.measureText(s).width<=w)return s;while(s.length>1&&ctx.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'}
function wrapLines(ctx,s,w,max){const out=[];let line='';for(const ch of s){if(ctx.measureText(line+ch).width>w){out.push(line);line=ch;if(out.length>=max)break}else line+=ch}if(out.length<max&&line)out.push(line);return out}
async function exportPng(){
  const u=mine();const rated=u.list.filter(m=>TIERS.includes(m.tier));
  if(!rated.length)return toast('등급을 매긴 영화가 아직 없어요.');
  toast('이미지를 만드는 중이에요…');
  const W=1200,pad=28,labelW=110,pw=100,ph=150,gap=12,cellH=ph+30,headH=104;
  const cols=Math.max(1,Math.floor((W-pad*2-labelW-gap+gap)/(pw+gap)));
  const rows=TIERS.map(t=>{const arr=rated.filter(m=>m.tier===t);return{t,arr,h:Math.max(1,Math.ceil(arr.length/cols))*(cellH+gap)+gap}});
  const H=headH+rows.reduce((s,r)=>s+r.h+8,0)+56;
  const imgs=new Map();await Promise.all(rated.map(m=>loadImg(posterUrl(m)).then(i=>imgs.set(m,i))));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const font='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const cs=getComputedStyle(document.documentElement);
  x.fillStyle='#0b0b10';x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,0,headH+40);g.addColorStop(0,'#3d0e18');g.addColorStop(1,'rgba(11,11,16,0)');x.fillStyle=g;x.fillRect(0,0,W,headH+40);
  x.textBaseline='alphabetic';x.fillStyle='#e8b64c';x.font='800 38px '+font;x.textAlign='left';x.fillText('🎬 '+fitText(x,u.nick+'의 영화 티어리스트',W-pad*2-60),pad,56);
  x.fillStyle='#9b98a8';x.font='400 18px '+font;x.fillText('총 '+rated.length+'편 · '+new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}),pad,88);
  let y=headH;
  rows.forEach(r=>{
    x.fillStyle='#14141c';x.fillRect(pad,y,W-pad*2,r.h);
    x.fillStyle=cs.getPropertyValue('--'+r.t).trim()||'#888';x.fillRect(pad,y,labelW,r.h);
    x.fillStyle='#15151a';x.font='900 64px '+font;x.textAlign='center';x.textBaseline='middle';x.fillText(r.t,pad+labelW/2,y+r.h/2);
    r.arr.forEach((m,i)=>{
      const cx=pad+labelW+gap+(i%cols)*(pw+gap),cy=y+gap+Math.floor(i/cols)*(cellH+gap),img=imgs.get(m);
      if(img){x.drawImage(img,cx,cy,pw,ph)}
      else{const h=hue(m.title);const gg=x.createLinearGradient(cx,cy,cx,cy+ph);gg.addColorStop(0,`hsl(${h},45%,28%)`);gg.addColorStop(1,`hsl(${h},50%,13%)`);x.fillStyle=gg;x.fillRect(cx,cy,pw,ph);
        x.fillStyle='#ddd';x.font='600 13px '+font;x.textAlign='center';x.textBaseline='middle';
        const ls=wrapLines(x,m.title,pw-14,5);ls.forEach((l,j)=>x.fillText(l,cx+pw/2,cy+ph/2+(j-(ls.length-1)/2)*17))}
      x.fillStyle='#ece8e1';x.font='400 12px '+font;x.textAlign='center';x.textBaseline='alphabetic';x.fillText(fitText(x,m.title,pw),cx+pw/2,cy+ph+19);
    });
    y+=r.h+8;
  });
  x.fillStyle='#5d5b6b';x.font='400 14px '+font;x.textAlign='center';x.fillText('MOVIE TIER · 영화 티어리스트',W/2,H-22);
  cv.toBlob(b=>{if(!b)return toast('이미지를 만들지 못했어요.');download(b,u.nick+'_영화티어리스트.png');toast('PNG 이미지를 저장했어요.')},'image/png');
}

/* ============ 설정 ============ */
function openSettings(){
  openModal(`<button class="x" data-act="close" aria-label="닫기">✕</button><h3>설정</h3>
  <label for="skey">TMDB API 키 (v3 키 또는 읽기 액세스 토큰)</label>
  <input id="skey" type="password" autocomplete="off" placeholder="키를 붙여넣으세요" value="${esc(cfg.key)}">
  <p class="hint">키를 입력하면 한국·해외 영화 검색과 포스터 이미지를 쓸 수 있어요. 키는 이 브라우저에만 저장되고, TMDB 서버 외에는 전송되지 않아요. <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">키 발급 안내</a></p>
  <div class="row2" style="margin-top:10px"><button class="btn primary sm" onclick="saveKey()">저장</button><button class="btn sm" onclick="clearKey()">키 삭제</button></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
  <label for="spw">복구 코드 다시 발급</label><input id="spw" type="password" placeholder="현재 비밀번호" autocomplete="current-password">
  <div class="row2" style="margin-top:8px"><button class="btn sm" onclick="reissueCode()">새 복구 코드 받기</button></div><div id="newcode"></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
  <label>데이터 백업 · 옮기기</label>
  <p class="hint" style="margin-top:0">이 페이지는 서버가 없어 데이터가 이 브라우저에만 저장돼요. 다른 기기로 옮기려면 백업 파일을 내보내고 가져오세요.</p>
   <div class="row2" style="margin-top:8px"><button class="btn sm" onclick="exportData()">백업 내보내기</button><button class="btn sm" onclick="$('#impf').click()">백업 가져오기</button><input id="impf" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"></div>
   <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
   <label>다른 기기로 계정 옮기기</label>
   <p class="hint" style="margin-top:0">계정과 티어리스트를 다른 브라우저로 복사합니다. 이동 코드에는 계정 인증 정보도 포함되므로 다른 사람에게 보내거나 공개하지 마세요. 자동 동기화는 지원하지 않습니다.</p>
   <button class="btn sm" onclick="exportTransferCode()">내 계정 이동 코드 만들기</button>
   <div id="transferExport" hidden><textarea id="transferOutput" rows="3" readonly style="width:100%;margin-top:8px;background:#0d0d13;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px"></textarea><button class="btn sm" style="margin-top:8px" onclick="copyTransferCode()">이동 코드 복사</button></div>`)
}
function saveKey(){cfg.key=$('#skey').value.trim();save(CFGK,cfg);closeModal();toast(cfg.key?'API 키를 저장했어요. 포스터를 불러올게요.':'API 키를 비웠어요.');
  if(cfg.key&&me){resolvePosters(mine().list)}}
function clearKey(){cfg.key='';save(CFGK,cfg);closeModal();toast('API 키를 삭제했어요.')}
async function reissueCode(){const u=mine();const pw=$('#spw').value;
  if(await sha(u.salt+':'+pw)!==u.ph)return toast('비밀번호가 맞지 않아요.');
  const c=genCode();u.rh=await sha(u.salt+':rc:'+normCode(c));if(!persist())return toast('저장에 실패했어요.');
  $('#newcode').innerHTML=`<div class="codebox">${esc(c)}</div><p class="hint" style="margin-top:0">이전 코드는 더 이상 쓸 수 없어요. 새 코드를 꼭 저장해 두세요.</p>`}
/* 별도 서버나 파일 없이 계정을 수동으로 옮기는 코드. 인증 정보도 포함되므로 공개 금지. */
function encodeTransfer(u){
  const payload=JSON.stringify({v:1,user:u});
  const bytes=new TextEncoder().encode(payload);
  let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  return 'MT1:'+btoa(binary);
}
function decodeTransfer(code){
  const val=String(code||'').replace(/\s/g,'');
  if(!val.startsWith('MT1:'))throw new Error('format');
  const bytes=Uint8Array.from(atob(val.slice(4)),c=>c.charCodeAt(0));
  const d=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));
  if(d.v!==1||!d.user||typeof d.user.nick!=='string'||!d.user.salt||!d.user.ph||!d.user.rh||!Array.isArray(d.user.list))throw new Error('data');
  const n=normNick(d.user.nick),err=checkNick(n);
  if(err||n!==d.user.nick||d.user.list.some(m=>!m||typeof m.title!=='string'||(m.tier!==null&&!TIERS.includes(m.tier))))throw new Error('data');
  return d.user;
}
function exportTransferCode(){
  const code=encodeTransfer(mine());
  $('#transferExport').hidden=false;$('#transferOutput').value=code;
  toast('이동 코드가 만들어졌어요. 다른 사람에게 공개하지 마세요.');
}
async function copyTransferCode(){
  const el=$('#transferOutput');if(!el)return;
  try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(el.value);toast('이동 코드를 복사했어요.')}catch(e){el.focus();el.select();toast('코드를 선택했어요. 직접 복사해 주세요.')}
}
function toggleTransferImport(){const el=$('#transferImport');if(el)el.hidden=!el.hidden}
function importTransferCode(){
  const el=$('#transferText');if(!el)return;
  let u;try{u=decodeTransfer(el.value)}catch(e){return toast('올바른 계정 이동 코드가 아니에요.')}
  const key=nkey(u.nick);
  if(db.users[key]&&!confirm('이 브라우저에 동일한 닉네임이 있습니다. 기존 계정과 영화 목록을 이동 코드의 내용으로 바꿀까요?'))return;
  const old=db.users[key];db.users[key]=u;
  if(!save(DBK,db)){if(old)db.users[key]=old;else delete db.users[key];return toast('저장에 실패했어요. 브라우저 저장 설정을 확인해 주세요.')}
  A.nick=u.nick;A.step='login';render();toast('계정을 가져왔어요. 기존 비밀번호로 로그인하세요.');
}
function exportData(){download(new Blob([JSON.stringify({v:1,users:db.users},null,1)],{type:'application/json'}),'movie-tier-backup.json')}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.users!=='object')throw 0;let n=0;
  for(const k in d.users){const u=d.users[k];if(u&&u.nick&&u.salt&&u.ph&&u.rh&&Array.isArray(u.list)){db.users[nkey(String(u.nick))]=u;n++}}
  if(!n)throw 0;persist();closeModal();toast(n+'개 계정을 가져왔어요.');render()}catch(e){toast('올바른 백업 파일이 아니에요.')}};r.readAsText(f)}

render();
</script>
